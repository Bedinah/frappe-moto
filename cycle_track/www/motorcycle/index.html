<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Motorcycle Inventory - CycleTrack</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, transparent 100%);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
            color: var(--text-primary);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .filter-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .motorcycle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .motorcycle-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, transparent 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .motorcycle-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .motorcycle-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .motorcycle-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .motorcycle-detail {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .motorcycle-price {
            font-size: 24px;
            font-weight: bold;
            color: var(--success);
            margin-top: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .badge-available {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge-sold {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid;
            animation: slideDown 0.3s ease-out;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .motorcycle-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body data_page="inventory">
    <div class="container">
        <header class="site-header">
            <div class="brand">
                <div class="logo">CT</div>
                <div class="app-title">🏍️ Motorcycle Inventory</div>
            </div>
            <div class="row">
                <a href="/admin_dashboard" class="btn btn-ghost">← Dashboard</a>
                <button id="add-motorcycle-btn" class="btn btn-primary">
                    + Add Motorcycle
                </button>
            </div>
        </header>

        <main>
            <!-- Statistics -->
            <div class="stats-grid" id="stats-container">
                <div class="stat-card">
                    <div class="stat-label">Total Motorcycles</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Available</div>
                    <div class="stat-value" id="stat-available" style="color: var(--success)">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Sold</div>
                    <div class="stat-value" id="stat-sold" style="color: var(--danger)">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Value</div>
                    <div class="stat-value" id="stat-value" style="color: var(--warning); font-size: 24px;">RWF 0</div>
                </div>
            </div>

            <!-- Filters -->
            <section class="card">
                <div id="alert-container"></div>
                
                <div class="filter-tabs">
                    <div class="filter-tab active" data-filter="all">All</div>
                    <div class="filter-tab" data-filter="Available">Available</div>
                    <div class="filter-tab" data-filter="Sold">Sold</div>
                </div>

                <div id="motorcycles-list" class="motorcycle-grid"></div>
            </section>
        </main>
    </div>

    <script>
        // ============================================================================
        // API FUNCTIONS
        // ============================================================================

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        async function frappeCall(method, args = {}) {
            try {
                const response = await fetch('/api/method/cycle_track.api.' + method, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Frappe-CSRF-Token': getCookie('csrf_token')
                    },
                    body: JSON.stringify(args)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP ${response.status}`);
                }

                const result = await response.json();
                return result.message;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ============================================================================
        // UI FUNCTIONS
        // ============================================================================

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alertId = `alert-${Date.now()}`;

            const alert = document.createElement('div');
            alert.id = alertId;
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>${message}</span>
                    <button onclick="document.getElementById('${alertId}').remove()" 
                            style="background: none; border: none; color: inherit; cursor: pointer; font-size: 18px;">
                        ×
                    </button>
                </div>
            `;

            container.insertBefore(alert, container.firstChild);

            setTimeout(() => {
                const el = document.getElementById(alertId);
                if (el) el.remove();
            }, 5000);
        }

        function showLoading() {
            const list = document.getElementById('motorcycles-list');
            list.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px;">Loading motorcycles...</p>
                </div>
            `;
        }

        function showEmpty() {
            const list = document.getElementById('motorcycles-list');
            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">🏍️</div>
                    <p style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">No motorcycles found</p>
                    <p>Click "Add Motorcycle" to add your first one</p>
                </div>
            `;
        }

        // ============================================================================
        // MOTORCYCLE MANAGEMENT
        // ============================================================================

        let allMotorcycles = [];
        let currentFilter = 'all';

        async function loadMotorcycles() {
            showLoading();
            
            try {
                const result = await frappeCall('route_list_motorcycles', { limit: 100 });

                if (result && result.success && result.data) {
                    allMotorcycles = result.data;
                    updateStats(allMotorcycles);
                    filterMotorcycles(currentFilter);
                } else {
                    showEmpty();
                }
            } catch (error) {
                showAlert('Error loading motorcycles: ' + error.message, 'danger');
                showEmpty();
            }
        }

        function updateStats(motorcycles) {
            const total = motorcycles.length;
            const available = motorcycles.filter(m => m.status === 'Available').length;
            const sold = total - available;
            const totalValue = motorcycles.reduce((sum, m) => sum + (parseFloat(m.price) || 0), 0);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-available').textContent = available;
            document.getElementById('stat-sold').textContent = sold;
            document.getElementById('stat-value').textContent = `RWF ${formatNumber(totalValue)}`;
        }

        function filterMotorcycles(filter) {
            currentFilter = filter;
            
            let filtered = allMotorcycles;
            if (filter !== 'all') {
                filtered = allMotorcycles.filter(m => m.status === filter);
            }

            renderMotorcycles(filtered);
        }

        function renderMotorcycles(motorcycles) {
            const list = document.getElementById('motorcycles-list');

            if (motorcycles.length === 0) {
                showEmpty();
                return;
            }

            list.innerHTML = motorcycles.map(moto => `
                <div class="motorcycle-card" onclick="viewMotorcycle('${moto.name}')">
                    <div class="motorcycle-icon">🏍️</div>
                    <div class="motorcycle-name">${escapeHtml(moto.brand)} ${escapeHtml(moto.model)}</div>
                    <div class="motorcycle-detail">📅 Year: ${moto.year}</div>
                    <div class="motorcycle-detail">🔢 Plate: ${escapeHtml(moto.plate_number || 'N/A')}</div>
                    <div class="motorcycle-price">RWF ${formatNumber(moto.price)}</div>
                    <span class="badge badge-${moto.status === 'Available' ? 'available' : 'sold'}">
                        ${moto.status}
                    </span>
                </div>
            `).join('');
        }

        function showAddMotorcycleModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'add-motorcycle-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>🏍️ Add New Motorcycle</h3>
                    
                    <form id="add-motorcycle-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="brand">Brand *</label>
                                <input type="text" id="brand" placeholder="e.g., Honda" required>
                            </div>

                            <div class="form-group">
                                <label for="model">Model *</label>
                                <input type="text" id="model" placeholder="e.g., CBR 500R" required>
                            </div>

                            <div class="form-group">
                                <label for="year">Year *</label>
                                <input type="number" id="year" value="2024" min="2000" max="2030" required>
                            </div>

                            <div class="form-group">
                                <label for="plate_number">Plate Number</label>
                                <input type="text" id="plate_number" placeholder="e.g., RAD 123A">
                            </div>

                            <div class="form-group full-width">
                                <label for="price">Price (RWF) *</label>
                                <input type="number" id="price" placeholder="2000000" required>
                            </div>
                        </div>

                        <div class="modal-buttons">
                            <button type="submit" class="btn-submit" id="submit-btn">
                                Add Motorcycle
                            </button>
                            <button type="button" class="btn-cancel" onclick="closeModal('add-motorcycle-modal')">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            `;

            document.body.appendChild(modal);

            document.getElementById('add-motorcycle-form').addEventListener('submit', handleAddMotorcycle);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal('add-motorcycle-modal');
                }
            });
        }

        async function handleAddMotorcycle(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const formData = {
                brand: document.getElementById('brand').value.trim(),
                model: document.getElementById('model').value.trim(),
                year: parseInt(document.getElementById('year').value),
                plate_number: document.getElementById('plate_number').value.trim(),
                price: parseFloat(document.getElementById('price').value)
            };

            if (!formData.brand || !formData.model || !formData.price) {
                showAlert('Please fill in all required fields', 'danger');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            try {
                const result = await frappeCall('route_create_motorcycle', formData);

                if (result && result.success) {
                    showAlert(`✅ ${formData.brand} ${formData.model} added successfully!`, 'success');
                    closeModal('add-motorcycle-modal');
                    loadMotorcycles();
                } else {
                    showAlert('Error: ' + (result.message || 'Unknown error'), 'danger');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Motorcycle';
            }
        }

        function viewMotorcycle(motorcycleId) {
            showAlert('View details coming soon!', 'success');
            // TODO: Implement view/edit modal
        }

        // ============================================================================
        // HELPER FUNCTIONS
        // ============================================================================

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.animation = 'fadeOut 0.2s ease-out';
                setTimeout(() => modal.remove(), 200);
            }
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        document.addEventListener('DOMContentLoaded', () => {
            loadMotorcycles();

            document.getElementById('add-motorcycle-btn').addEventListener('click', showAddMotorcycleModal);

            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterMotorcycles(tab.dataset.filter);
                });
            });
        });
    </script>
</body>
</html>
