<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard - CycleTrack</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="assets/cycle_track/css/cycle_track.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="/assets/cycle_track/js/cycle_track.js"></script>
</head>
<body data_page="admin_dashboard">
  <div class="container">
    <header class="site-header">
      <div class="brand"><div class="logo">CT</div><div class="app-title">CycleTrack Admin</div></div>
      <div class="row">
        <a href="/contract" class="btn btn-ghost">Inventory</a>
        <a href="/installments" class="btn btn-ghost">Installments</a>
      </div>
    </header>

    <main>
      <section class="grid" style="margin-top:16px">
        <div class="card kpi">
          <div class="kpi-left"><div class="value" id="kpi-total-motos">-</div><div class="label">Total Motorcycles</div></div>
        </div>
        <div class="card kpi">
          <div class="kpi-left"><div class="value" id="kpi-active-contracts">-</div><div class="label">Active Contracts</div></div>
        </div>
      </section>

      <section class="grid" style="margin-top:16px">
        <div class="card">
          <div class="label">Money Received (This month)</div>
          <div class="value" id="kpi-received-month">-</div>
        </div>
        <div class="card">
          <div class="label">Outstanding Balance</div>
          <div class="value" id="kpi-outstanding">-</div>
        </div>
      </section>

      <section class="card" style="margin-top:16px">
        <h4 class="small">Monthly Payments</h4>
        <canvas id="payments-chart" height="90"></canvas>
      </section>
    </main>
  </div>
</body>
</html>
