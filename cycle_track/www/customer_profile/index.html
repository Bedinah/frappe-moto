<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CycleTrack - Customer Profile</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
			}

			/* Header */
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 40px;
				background: rgba(255, 255, 255, 0.1);
				backdrop-filter: blur(10px);
				padding: 20px 30px;
				border-radius: 16px;
				border: 1px solid rgba(255, 255, 255, 0.2);
			}

			.logo {
				display: flex;
				align-items: center;
				gap: 12px;
				color: white;
				font-size: 24px;
				font-weight: 700;
			}

			.logo-icon {
				width: 40px;
				height: 40px;
				background: white;
				border-radius: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 24px;
			}

			.user-info {
				display: flex;
				align-items: center;
				gap: 15px;
				color: white;
			}

			.user-avatar {
				width: 45px;
				height: 45px;
				background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-weight: 600;
				color: #667eea;
				font-size: 18px;
			}

			/* Main Content Grid */
			.grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 24px;
				margin-bottom: 24px;
			}

			/* Cards */
			.card {
				background: rgba(255, 255, 255, 0.95);
				backdrop-filter: blur(10px);
				border-radius: 20px;
				padding: 32px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
				border: 1px solid rgba(255, 255, 255, 0.5);
				transition: transform 0.3s ease, box-shadow 0.3s ease;
			}

			.card:hover {
				transform: translateY(-5px);
				box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
			}

			.card-header {
				display: flex;
				align-items: center;
				gap: 12px;
				margin-bottom: 24px;
				padding-bottom: 16px;
				border-bottom: 2px solid #f0f0f0;
			}

			.card-icon {
				width: 48px;
				height: 48px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border-radius: 12px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 24px;
				color: white;
			}

			.card-title {
				font-size: 20px;
				font-weight: 700;
				color: #1a202c;
			}

			/* Payment Summary */
			.payment-summary {
				grid-column: 1 / -1;
			}

			.summary-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 20px;
			}

			.summary-item {
				padding: 24px;
				background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
				border-radius: 16px;
				border-left: 4px solid #667eea;
			}

			.summary-label {
				font-size: 14px;
				color: #718096;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				margin-bottom: 8px;
				font-weight: 600;
			}

			.summary-value {
				font-size: 32px;
				font-weight: 800;
				color: #1a202c;
				margin-bottom: 8px;
			}

			.summary-value.highlight {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}

			.summary-meta {
				font-size: 13px;
				color: #a0aec0;
			}

			/* Pay Button */
			.pay-btn {
				width: 50%;
				padding: 18px;
				background: white;
				color: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border: none;
				border-radius: 12px;
				font-size: 16px;
				font-weight: 700;
				cursor: pointer;
				transition: all 0.3s ease;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				margin-top: 16px;
				box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
			}

			.pay-btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
			}

			.pay-btn:active {
				transform: translateY(0);
			}

			/* Contract Details */
			.contract-info {
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.info-row {
				display: flex;
				justify-content: space-between;
				padding: 16px;
				background: #f7fafc;
				border-radius: 12px;
				transition: background 0.2s ease;
			}

			.info-row:hover {
				background: #edf2f7;
			}

			.info-label {
				font-weight: 600;
				color: #4a5568;
			}

			.info-value {
				font-weight: 700;
				color: #1a202c;
			}

			.status-badge {
				display: inline-block;
				padding: 6px 16px;
				background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
				color: white;
				border-radius: 20px;
				font-size: 13px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}

			/* Payment History */
			.history-list {
				display: flex;
				flex-direction: column;
				gap: 12px;
				max-height: 400px;
				overflow-y: auto;
				padding-right: 8px;
			}

			.history-list::-webkit-scrollbar {
				width: 6px;
			}

			.history-list::-webkit-scrollbar-track {
				background: #f1f1f1;
				border-radius: 10px;
			}

			.history-list::-webkit-scrollbar-thumb {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border-radius: 10px;
			}

			.history-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 20px;
				background: linear-gradient(135deg, #f7fafc 0%, #ffffff 100%);
				border-radius: 12px;
				border: 1px solid #e2e8f0;
				transition: all 0.3s ease;
			}

			.history-item:hover {
				border-color: #667eea;
				transform: translateX(5px);
				box-shadow: 0 5px 20px rgba(102, 126, 234, 0.1);
			}

			.history-date {
				font-weight: 600;
				color: #2d3748;
			}

			.history-amount {
				font-size: 18px;
				font-weight: 700;
				color: #667eea;
			}

			.history-status {
				font-size: 12px;
				color: #48bb78;
				font-weight: 600;
			}

			.empty-state {
				text-align: center;
				padding: 60px 20px;
				color: #a0aec0;
			}

			.empty-icon {
				font-size: 64px;
				margin-bottom: 16px;
				opacity: 0.5;
			}

			/* Responsive */
			@media (max-width: 768px) {
				.grid {
					grid-template-columns: 1fr;
				}

				.header {
					flex-direction: column;
					gap: 16px;
					text-align: center;
				}

				.summary-grid {
					grid-template-columns: 1fr;
				}

				.card {
					padding: 24px;
				}
			}

			/* Animations */
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.card {
				animation: fadeIn 0.6s ease forwards;
			}

			.card:nth-child(1) {
				animation-delay: 0.1s;
			}
			.card:nth-child(2) {
				animation-delay: 0.2s;
			}
			.card:nth-child(3) {
				animation-delay: 0.3s;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<!-- Header -->
			<div class="header">
				<div class="logo">
					<div class="logo-icon">🚴</div>
					<span>CycleTrack</span>
				</div>
				<div class="user-info">
					<div>
						<div style="font-weight: 600; font-size: 16px">Welcome back!</div>
						<div style="font-size: 14px; opacity: 0.9">Customer Portal</div>
					</div>
					<div class="user-avatar">JD</div>
				</div>
			</div>
			<!-- Payment Summary -->
			<div class="card payment-summary">
				<div class="card-header">
					<div class="card-icon">💳</div>
					<h2 class="card-title">Payment Overview</h2>
				</div>
				<div class="summary-grid">
					<div class="summary-item">
						<div class="summary-label">Next Payment Due</div>
						<div class="summary-value highlight">$250.00</div>
						<div class="summary-meta">Due on December 1, 2025</div>
					</div>
					<div class="summary-item">
						<div class="summary-label">Remaining Balance</div>
						<div class="summary-value">$1,250.00</div>
						<div class="summary-meta">5 payments remaining</div>
					</div>
					<div class="summary-item">
						<div class="summary-label">Total Paid</div>
						<div class="summary-value">$750.00</div>
						<div class="summary-meta">3 of 8 payments complete</div>
					</div>
				</div>
				<!-- <button class="pay-btn" onclick="alert('Payment processing would happen here')">Make Payment Now</button> -->
			</div>

			<div class="pay-btn">
				<a href="/pay" class="btn btn-primary">Make Payment Now</a>
			</div>
		</div>
	</body>
</html>
