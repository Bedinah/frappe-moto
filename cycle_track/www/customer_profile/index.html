<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Customer Profile - CycleTrack</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/cycle_track/css/cycle_track.css">
  <script defer src="/assets/cycle_track/js/cycle_track.js"></script>
</head>
<body data_page="customer_profile">
  <div class="container">
    <header class="site-header">
      <div class="brand"><div class="logo">CT</div><div class="app-title">CycleTrack</div></div>
      <div><a href="/payments" class="btn btn-ghost">My Payments</a></div>
    </header>

    <main>
      <section class="card">
        <h3>Welcome, <span class="small">Customer</span></h3>
        <div class="grid" style="align-items:center;">
          <div class="card payment-card">
            <div class="small">Next payment due</div>
            <div id="next-due" class="value">—</div>
            <div class="small">Remaining balance</div>
            <div id="remaining-balance" class="value mono">—</div>
            <div class="row">
              <a href="/pay" class="btn btn-primary">Pay Now</a>
              <a href="/payments" class="btn btn-ghost">Payment History</a>
            </div>
          </div>
          <div class="card">
            <h4 class="small">Contract</h4>
            <div class="empty">Contract details will appear here.</div>
          </div>
        </div>
      </section>

      <section class="card" style="margin-top:16px">
        <h4 class="small">Payment History</h4>
        <div id="payment-history" class="list"></div>
      </section>
    </main>
  </div>
</body>
</html>
