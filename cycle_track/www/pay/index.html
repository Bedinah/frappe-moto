{% extends "templates/web.html" %} {% block title %}Pay Installment{% endblock %}
<link rel="stylesheet" href="/assets/cycle_track/css/cycle_track.css" />
{% block page_content %}

<div class="ct-header">
	<div class="ct-header-content">
		<a href="/" class="ct-logo"> 🏍️ CycleTrack </a>
		<nav class="ct-nav">
			<a href="#contract">My Contract</a>
			<a href="#payments">Payments</a>
			<a href="/app/user">Account</a>
		</nav>
	</div>
</div>

<div class="ct-card">
	<h2>Pay Installment</h2>
	<form method="post">
		<input type="hidden" name="contract" value="{{ frappe.form_dict.contract }}" />
		<label>Amount</label>
		<input class="mf-input" type="number" name="amount" step="0.01" required />
		<label>Payment Date</label>
		<input class="mf-input" type="date" name="payment_date" required />
		<label>Mode</label>
		<select class="mf-input" name="mode">
			<option>Cash</option>
			<option>Mobile Money</option>
			<option>Bank Transfer</option>
		</select>
		<label>Reference</label>
		<input class="mf-input" type="text" name="reference" />
		<button class="mf-btn mf-primary" type="submit">Submit Payment</button>
	</form>
</div>
{% endblock %}
