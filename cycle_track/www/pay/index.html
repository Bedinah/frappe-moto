<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Make a Payment - CycleTrack</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/cycle_track/css/cycle_track.css">
  <script defer src="/assets/cycle_track/js/cycle_track.js"></script>
</head>
<body data_page="pay">
  <div class="container">
    <header class="site-header">
      <div class="brand"><div class="logo">CT</div><div class="app-title">Pay Installment</div></div>
      <div><a href="/customer_profile" class="btn btn-ghost">Back</a></div>
    </header>

    <main>
      <section class="card">
        <form id="pay-form">
          <div class="small">Amount</div>
          <input id="pay-amount" class="input" type="number" placeholder="Enter amount" required>
          <div style="margin-top:12px" class="row">
            <button class="btn btn-primary" type="submit">Pay</button>
            <a href="/payments" class="btn btn-ghost">Payment History</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
