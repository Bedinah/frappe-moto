<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Manage Contracts - CycleTrack Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/cycle_track/css/cycle_track.css">
  <style>
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--card); padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { margin-top: 0; margin-bottom: 20px; }
    .modal-content label { display: block; margin-top: 12px; font-weight: 500; font-size: 0.9rem; }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 4px; font-family: inherit; }
    .alert { padding: 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid; }
    .alert-success { background: #d4edda; border-color: #28a745; color: #155724; }
    .alert-danger { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .alert-info { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }
    .badge-info { background: rgba(13,71,161,0.2); color: #0D47A1; }
  </style>
  <script defer src="/assets/cycle_track/js/cycle_track.js"></script>
</head>
<body data_page="admin_contracts">
  <div class="container">
    <header class="site-header">
      <div class="brand"><div class="logo">CT</div><div class="app-title">Manage Contracts</div></div>
      <div class="row">
        <a href="/admin_dashboard" class="btn btn-ghost">Dashboard</a>
        <button id="create-contract-btn" class="btn btn-primary">+ New Contract</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div id="contracts-list" class="list"></div>
      </section>
    </main>
  </div>
</body>
</html>
